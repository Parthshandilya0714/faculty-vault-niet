app = 'faculty-vault-niet'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[processes]
  app = "java -Dserver.port=8080 -Dserver.address=0.0.0.0 -jar /app.war"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1