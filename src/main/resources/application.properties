# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# Spring MVC View Resolver for JSP Pages
# ==========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ==========================================
# Session Configuration
# ==========================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=FACULTY_VAULT_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie

# ==========================================
# File Upload Configuration (Up to 10 GB)
# ==========================================
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
file.upload-dir=uploads/proofs/

# ==========================================
# Supabase Cloud PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.pluvntupezycmtalkvop
spring.datasource.password=Palak@071407
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Fixes (Prevents Supabase Connection Timeouts & Closes)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.validation-timeout=5000

# JPA & Hibernate Settings for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# ==========================================
# Email SMTP Configuration (For Registration OTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=apna_email@gmail.com
spring.mail.password=apna_gmail_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# Logging Level
# ==========================================
logging.level.org.springframework.web=INFO
logging.level.com.niet.facultyvault=DEBUG